name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o JarvisAndroid.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Gradle Wrapper
        run: |
          cd JarvisAndroid
          gradle wrapper --gradle-version 8.7
      - name: Build APK
        run: |
          cd JarvisAndroid
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: JarvisAndroid/app/build/outputs/apk/debug/app-debug.apk
